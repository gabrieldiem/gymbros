name: Run tests

on:
  push:
    branches-ignore:
      - "main"
  pull_request:
    branches-ignore:
      - "main"
  workflow_call:

jobs:
  deploy-script:
    name: deploy script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test deploy and rollback against a fake Portainer
        run: python3 deploy/test_portainer_deploy.py

  secret-leak-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose

  api-test:
    name: api tests
    needs: [secret-leak-scan]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gymbros
          POSTGRES_PASSWORD: gymbros
          POSTGRES_DB: gymbros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymbros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: gymbros
      POSTGRES_PASSWORD: gymbros

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Poetry
        run: pip install "poetry==2.3.2" && poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint (black, pylint, mypy)
        run: |
          poetry run black --check src tests migrations
          poetry run pylint src
          poetry run mypy src --check-untyped-defs

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests
        run: poetry run pytest -m "not skip" --color=yes --junitxml=reports/junit_report.xml --cov=src --cov-report term --cov-report html:reports/coverage -W ignore::DeprecationWarning

  web-test:
    name: web lint, test and build
    needs: [secret-leak-scan]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
