name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image-scan:
    name: vulnerabilities scan (trivy)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t gymbros-${{ matrix.app }}:scan apps/${{ matrix.app }}
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
        run: |
          curl -sSLo "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C /usr/local/bin trivy
      - name: Scan image for vulnerabilities
        run: |
          trivy image --download-db-only
          trivy image --ignorefile .trivyignore.yaml --format table --exit-code 0 --severity HIGH --scanners vuln,misconfig,license --skip-db-update gymbros-${{ matrix.app }}:scan
          trivy image --ignorefile .trivyignore.yaml --format table --exit-code 1 --severity CRITICAL --scanners vuln,misconfig,license --skip-db-update --quiet gymbros-${{ matrix.app }}:scan

  # Placeholder: there is no deploy target yet (see "Hosting" under Decide in BACKLOG.md).
  # It runs after tests and the image scan pass, and only reports that nothing was deployed.
  # When hosting is chosen, replace the step below with the real deploy (data-service uses a
  # Coolify webhook plus status polling) and add its secrets to the `prod` environment.
  deploy:
    needs: [test, image-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: No deploy target yet
        run: |
          echo "Tests and the image scan passed for ${GITHUB_SHA}."
          echo "Nothing was deployed: no hosting target is configured yet."
