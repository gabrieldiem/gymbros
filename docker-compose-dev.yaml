# GYMBROS (dev): postgres + api (uvicorn --reload, ./apps/api/src mounted) + web (Vite dev server)
#
#   make up    → http://localhost:5173 (web; Vite proxies /api to the api)
#                http://localhost:8080/docs (api)
#
# Values come from .env (copy .env.example). POSTGRES_HOST is overridden to the compose service.

name: gymbros-dev

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
  # Email-only sign-in for demo and e2e accounts. Production refuses to start with it.
  DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  # Who can open the backoffice. The e2e crews' Gabi is an admin, so the suite can test it.
  ADMIN_EMAILS: ${ADMIN_EMAILS:-gabi@demo.gymbros.app,gabi@mobile.e2e.gymbros.app,gabi@desktop.e2e.gymbros.app}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB}
  SESSION_SECRET: ${SESSION_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  RUN_MIGRATIONS_ON_STARTUP: "true"

services:
  postgres:
    container_name: gymbros-postgres-dev
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only: reachable from this machine's tools (native api, psql), not from the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      # Ready means the real server answers a query in the app's database over TCP. On a new volume
      # the image first runs a socket-only server for its setup, then restarts: pg_isready on the
      # socket passes during that window, so the api would start against a database about to go.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'select 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  api:
    container_name: gymbros-api-dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      <<: *api-env
    volumes:
      - ./apps/api/src:/app
      - ./apps/api/settings.json:/settings.json:ro
      # ./src is mounted at /app, so the repo root resolves to "/". migrations/ is writable so
      # `make migration` can write the autogenerated revision back to the host.
      - ./apps/api/alembic.ini:/alembic.ini:ro
      - ./apps/api/migrations:/migrations
    healthcheck:
      # /health runs a query and answers 503 if the database is down, which fails urlopen.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
      start_interval: 1s

  web:
    container_name: gymbros-web-dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY: http://api:8080
      # Bind mounts on some hosts (WSL, NTFS, Docker Desktop) don't deliver inotify events.
      VITE_USE_POLLING: "true"
    volumes:
      - ./apps/web:/app
      # Keep the image's node_modules (built for Linux) instead of the host's.
      - /app/node_modules
    healthcheck:
      # Vite serves the app's index.html with the React root once it's ready.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ | grep -q 'id=\"root\"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start pre-bundles dependencies.
      start_period: 60s
      start_interval: 2s

volumes:
  postgres_dev_data:
