# GYMBROS (dev): postgres + api (uvicorn --reload, ./apps/api/src mounted) + web (Vite dev server)
#
#   make up    → http://localhost:5173 (web; Vite proxies /api to the api)
#                http://localhost:8080/docs (api)
#
# Values come from .env (copy .env.example). POSTGRES_HOST is overridden to the compose service.

name: gymbros-dev

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB}
  SESSION_SECRET: ${SESSION_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  RUN_MIGRATIONS_ON_STARTUP: "true"

services:
  postgres:
    container_name: gymbros-postgres-dev
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only: reachable from this machine's tools (native api, psql), not from the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  api:
    container_name: gymbros-api-dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      <<: *api-env
    volumes:
      - ./apps/api/src:/app
      - ./apps/api/settings.json:/settings.json:ro
      # ./src is mounted at /app, so the repo root resolves to "/". migrations/ is writable so
      # `make migration` can write the autogenerated revision back to the host.
      - ./apps/api/alembic.ini:/alembic.ini:ro
      - ./apps/api/migrations:/migrations
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
      start_interval: 1s

  web:
    container_name: gymbros-web-dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY: http://api:8080
      # Bind mounts on some hosts (WSL, NTFS, Docker Desktop) don't deliver inotify events.
      VITE_USE_POLLING: "true"
    volumes:
      - ./apps/web:/app
      # Keep the image's node_modules (built for Linux) instead of the host's.
      - /app/node_modules

volumes:
  postgres_dev_data:
