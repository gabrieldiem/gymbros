[project]
name = "gymbros-api"
version = "0.1.0"
description = "GYMBROS API: accounts, workouts, scoring and the ATUS Climb standings"
authors = [{ name = "Gabriel Diem" }]
requires-python = ">=3.13,<4.0"

[tool.poetry]
packages = [{ include = "src" }]
package-mode = false

[tool.poetry.dependencies]
fastapi = "^0.162.0"
uvicorn = { version = "^0.54.0", extras = ["standard"] }
python-dotenv = "^1.2.4"
pydantic = "^2.14.2"
sqlalchemy = { version = "^2.1.6", extras = ["asyncio"] }
asyncpg = "^0.32.0"
alembic = "^1.20.1"
uvloop = "^0.23.0"
argon2-cffi = ">=25.1.0,<26"
email-validator = ">=2.3,<3"
tzdata = ">=2025.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
pytest-socket = "^0.8.1"
pytest-asyncio = "^1.4.1"
httpx = "^0.28.1"
pre-commit = "^4.5.1"
pylint = "^4.1.3"
mypy = "^2.4.1"
black = "^26.10.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Network is off for every test. Only loopback and the test database host may be reached;
# conftest.py adds the database host from POSTGRES_HOST at session start.
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src"]
omit = ["src/migrations/*"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'src')"
py-version = "3.13"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.similarities]
min-similarity-lines = 8

[tool.pylint.design]
max-attributes = 10
max-args = 10
max-positional-arguments = 8
max-locals = 20
min-public-methods = 1

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
