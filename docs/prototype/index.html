<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYMBROS">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' fill='%230D0D0D'/%3E%3Cpath d='M4 28 13 9l6 10 4-6 7 15z' fill='%23FFE600'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22GYMBROS%22%2C%22short_name%22%3A%22GYMBROS%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230D0D0D%22%2C%22theme_color%22%3A%22%230D0D0D%22%2C%22start_url%22%3A%22.%22%7D">
<title>GYMBROS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#0D0D0D;       /* background */
  --rail:#080808;       /* navigation */
  --plate:#171717;      /* panels */
  --steel:#2A2A2A;      /* lines, borders */
  --chalk:#F2F2EE;      /* text */
  --smoke:#8E8E8A;      /* secondary text */
  --volt:#FFE600;       /* hazard yellow: primary, you */
  --red:#FF3B1F;        /* PRs, passes, alerts */
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-h:72px;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--iron);color:var(--chalk);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
h1,h2,h3,.display{font-family:var(--display);font-weight:700;line-height:1.05;letter-spacing:.005em}
h1{font-size:clamp(2.2rem,7vw,3rem)}
h2{font-size:1.5rem;margin-bottom:.8rem}
h3{font-size:1.25rem}
p{max-width:62ch}
.muted{color:var(--smoke)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.volt{color:var(--volt)}

/* ---------- shell ---------- */
.rail{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:space-around;align-items:center;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--rail);border-top:1px solid var(--steel)}
.rail .brand{display:none}
.rail a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px;min-width:58px;
  font-weight:600;font-size:.72rem;color:var(--smoke);text-decoration:none}
.rail a svg{width:24px;height:24px}
.rail a[aria-current=page]{color:var(--volt)}
.rail a.log .disc{display:grid;place-items:center;width:54px;height:54px;margin-top:-24px;border-radius:18px;background:var(--volt);color:var(--iron);
  box-shadow:0 0 0 6px var(--rail)}
.rail a.log svg{width:30px;height:30px;color:var(--iron)}
.rail a.log .lbl{color:var(--chalk)}
.rail .live-dot{position:absolute;top:-24px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--rail)}
main{width:100%;max-width:1240px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 18px calc(var(--nav-h) + 64px + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand b{font-family:var(--display);font-weight:900;font-style:italic;font-size:1.6rem;letter-spacing:.01em;line-height:1}
.brand svg{flex:none}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .acts{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;background:var(--plate);border:1px solid var(--steel);border-radius:12px}
.icon-btn svg{width:22px;height:22px}
.icon-btn .count{position:absolute;top:-6px;right:-6px;display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;border-radius:999px}
.lang{display:flex;border:1px solid var(--steel);height:44px;border-radius:12px;overflow:hidden}
.lang button{padding:0 11px;font-weight:700;font-size:.85rem;color:var(--smoke)}
.lang button[aria-pressed=true]{background:var(--chalk);color:var(--iron)}
.topbar .me-btn .av{--s:44px}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .rail{position:sticky;top:0;align-self:start;height:100vh;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;
    padding:28px 16px;border-top:0;border-right:1px solid var(--steel)}
  .rail .brand{display:flex;order:-2;margin:0 0 6px 4px;color:var(--chalk)}
  .rail .tag{display:block!important;order:-2;margin:0 0 26px 6px;color:var(--smoke);font-size:.9rem}
  .rail a{flex-direction:row;gap:14px;padding:11px 12px;font-size:1rem;border-radius:10px}
  .rail a[aria-current=page]{background:var(--plate)}
  .rail a.log{order:-1;margin-bottom:18px;background:var(--volt);color:var(--iron);border-radius:12px;}
  .rail a.log .disc{width:auto;height:auto;margin:0;background:none;box-shadow:none;}
  .rail a.log svg{width:22px;height:22px}
  .rail a.log .lbl{color:var(--iron)}
  .rail .live-dot{top:50%;right:16px;transform:translateY(-50%);box-shadow:none;background:var(--iron)}
  main{padding:26px 52px 64px}
  .topbar .brand{visibility:hidden}
}
.rail .tag{display:none}

/* ---------- shared ---------- */
.av{--s:36px;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:50%;
  background:var(--c);color:var(--iron);font-weight:700;font-size:calc(var(--s)*.36)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 28px;
  font-weight:700;font-size:1.05rem;text-decoration:none;white-space:nowrap;border-radius:var(--r);
  transition:transform .1s ease,background .12s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--volt);color:var(--iron)}
.btn.primary:hover{background:#FFF04D}
.btn.ghost{background:var(--steel);color:var(--chalk)}
.btn.ghost:hover{background:#383838}
.btn.quiet{color:var(--smoke);font-size:1rem}
.btn.quiet:hover{color:var(--chalk)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:.95rem;border-radius:10px}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--plate);border-radius:12px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:.92rem;color:var(--smoke);
  white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--chalk);color:var(--iron)}
.bar{height:8px;background:var(--steel);overflow:hidden;border-radius:99px}
.bar i{display:block;height:100%;background:var(--c,var(--volt));transition:width .5s ease}
.view-head{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.view-head p{margin-top:10px}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,59,31,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,59,31,0)}100%{box-shadow:0 0 0 0 rgba(255,59,31,0)}}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:10px;height:10px;border:2px solid var(--steel);border-radius:50%}
.pips i.on{background:var(--volt);border-color:var(--volt)}
.pips i.over{background:var(--red);border-color:var(--red)}
.pips.lg{gap:6px}
.pips.lg i{width:16px;height:16px;border-width:2px}
.panel{position:relative;padding:22px;background:var(--plate);border:1px solid var(--steel);border-radius:16px}
.panel.edge{border-color:#3A3A2A}

/* ---------- climb ---------- */
.hero{position:relative;padding:10px 0 6px}
.hero h1{font-size:clamp(3rem,11vw,5.6rem);font-weight:900;font-style:italic;text-transform:uppercase;line-height:.9}
.hero h1 span{display:block}
.hero h1 .volt{color:var(--volt)}
.hero > p{margin-top:10px;font-size:1.02rem;color:var(--smoke)}
.hero-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.conds{display:flex;flex-wrap:wrap;gap:8px}
.cond{display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 10px;border-radius:999px;font-weight:600;font-size:.88rem;
  }
.cond svg{width:16px;height:16px;flex:none}
.cond.storm{background:rgba(0,209,255,.12);color:#6FE3FF}
.cond.bounty{background:rgba(255,59,31,.14);color:#FF8470}
.trail-grid{display:grid;gap:26px;margin-top:22px}
.trail-grid > *{min-width:0}
.map-wrap{position:relative;margin:0 -18px}
#map{display:block;width:100%;height:auto;max-height:88vh;touch-action:pan-y;background:#0A0A0A;border-radius:0}
.ct{fill:none;stroke:#1E1E1E;stroke-width:1}
.ct.idx{stroke:#2E2E2E;stroke-width:1.8}
.ct.far{stroke:#191919}
.trail{fill:none;stroke:var(--chalk);stroke-opacity:.4;stroke-width:2.6;stroke-dasharray:3 8;stroke-linecap:round}
.trail-you{fill:none;stroke:var(--volt);stroke-width:5;stroke-linecap:round}
.camp-dot{fill:var(--iron);stroke:var(--chalk);stroke-width:2.5}
.camp-name{font-family:var(--display);font-weight:700;font-size:17px;fill:var(--chalk)}
.camp-pts{font-family:var(--body);font-size:11.5px;font-weight:600;fill:var(--smoke)}
.mk{cursor:pointer;outline:none}
.mk .ring{fill:none;stroke:transparent;stroke-width:3}
.mk:focus-visible .ring,.mk:hover .ring{stroke:var(--chalk)}
.mk text{font-family:var(--body);font-weight:700;font-size:14px;fill:var(--iron);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk .tag{font-size:18px;fill:var(--volt)}
.mk .live{fill:var(--red);stroke:var(--iron);stroke-width:2.5}
.mk .bty{font-size:15px}
.mk.me .halo{fill:var(--volt);fill-opacity:.2}
.mk.me .body{stroke:var(--iron);stroke-width:3}
#revealPath{transition:stroke-dashoffset 1.5s cubic-bezier(.45,.05,.3,1)}
.map-title{position:absolute;left:12px;top:12px;padding:5px 11px;background:rgba(8,8,8,.8);border:1px solid var(--steel);border-radius:8px;color:var(--chalk);font-weight:700;font-size:.85rem;line-height:1.2;pointer-events:none}
.map-ticker{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(8,8,8,.92);border:1px solid var(--steel);border-radius:12px;
  font-size:.92rem;font-weight:600;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
.map-ticker.on{opacity:1;transform:none}
.map-ticker .av{--s:26px}
.standing{display:flex;align-items:flex-start;gap:18px}
.rank-big{font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:.85;color:var(--volt)}
.rank-big sup{font-size:.36em;vertical-align:top;margin-left:2px}
.standing .pts{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1}
.standing .rk-name{display:inline-block;margin-top:8px;padding:3px 10px;background:var(--steel);color:var(--chalk);border-radius:999px;font-weight:600;font-size:.85rem;
  }
.goal-row{display:flex;align-items:center;gap:14px;margin:18px 0;padding:14px;background:var(--iron);border-radius:12px;font-size:.95rem;line-height:1.35;font-weight:500}
.gaps{list-style:none;margin:0 0 20px;display:grid;gap:10px}
.gaps li{display:flex;align-items:center;gap:10px}
.gaps .av{--s:28px}
.vs-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:12px;border-radius:12px;overflow:hidden}
.vs-strip div{padding:12px 10px;background:var(--iron);text-align:center}
.vs-strip b{display:block;font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.1}
.vs-strip b.down{color:var(--smoke)}
.vs-strip span{font-size:.78rem;color:var(--smoke);font-weight:600}
.vs-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;font-weight:700;font-size:.95rem}
.recap-card{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:14px 16px;text-align:left;background:var(--plate);border:1px solid var(--steel);border-radius:16px;
  }
.recap-card b{display:block;font-weight:700;font-size:1.05rem;line-height:1.2}
.recap-card .sub{font-size:.88rem;color:var(--smoke)}
.stack{display:flex}
.stack .av{--s:32px;box-shadow:0 0 0 2px var(--plate);margin-left:-9px}
.stack .av:first-child{margin-left:0}
.training{margin-top:26px}
.training h2{display:flex;align-items:center;gap:10px}
.training ul{list-style:none;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.training li button{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:var(--plate);border:1px solid var(--steel);border-radius:999px;white-space:nowrap;text-align:left;line-height:1.2;font-weight:600}
.training li .t{display:block;font-size:.8rem;color:var(--smoke);font-weight:500}
.rope{list-style:none;position:relative;margin-top:6px}
.rope::before{content:"";position:absolute;left:41px;top:22px;bottom:22px;width:2px;background:var(--steel)}
.rope li button{position:relative;display:grid;grid-template-columns:24px 40px 1fr auto;align-items:center;gap:12px;width:100%;padding:10px 8px 10px 0;text-align:left}
.rope li button{border-radius:12px}
.rope li button:hover{background:rgba(255,255,255,.03)}
.rope .rk{font-weight:700;font-size:1rem;color:var(--smoke);text-align:right}
.rope li:first-child .rk{color:var(--volt)}
.rope .av{--s:40px;box-shadow:0 0 0 4px var(--iron)}
.rope .who b{display:block;font-weight:700;font-size:1.05rem}
.rope .who > span{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--smoke)}
.rope .p{font-family:var(--display);font-weight:700;font-size:1.3rem;text-align:right;line-height:1.1}
.rope .p small{display:block;font-family:var(--body);font-style:normal;font-size:.72rem;font-weight:700;color:var(--red)}
.rope li.me .who b{color:var(--volt)}
@media (min-width:700px){
  .map-wrap{margin:0}
  #map{border:1px solid var(--steel);border-radius:16px}
}
@media (min-width:1120px){
  .trail-grid{grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:36px;align-items:start}
  .trail-side{position:sticky;top:26px}
}

/* ---------- feed ---------- */
.feed{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:700px}
.feed > li{min-width:0}
.post{padding:18px 18px 14px;background:var(--plate);border:1px solid var(--steel);border-radius:16px}
.post.mine{border-color:#3A3A2A}
.post-top{display:flex;align-items:center;gap:12px}
.post-top .who{flex:1;line-height:1.25}
.post-top .who b{font-weight:700}
.post-top .who span{display:block;font-size:.85rem;color:var(--smoke)}
.pts-chip{font-family:var(--display);font-weight:700;font-size:1.25rem}
.post h3{margin:12px 0 10px;font-size:1.35rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:4px 11px;background:var(--iron);border-radius:999px;font-size:.85rem;font-weight:500}
.pr-line{display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 12px;background:rgba(255,59,31,.12);color:#FF8470;border-radius:10px;font-weight:600;font-size:.95rem}
.pr-line svg{flex:none;width:20px;height:20px}
.post details{margin-top:12px}
.post summary{cursor:pointer;color:var(--smoke);font-size:.9rem;font-weight:700;list-style:none}
.post summary::-webkit-details-marker{display:none}
.post details[open] summary{color:var(--chalk)}
.ex-detail{list-style:none;margin-top:10px;display:grid;gap:6px;font-size:.92rem}
.ex-detail li{display:flex;justify-content:space-between;gap:12px;padding-bottom:6px;border-bottom:1px dashed var(--steel)}
.ex-detail li span:last-child{color:var(--smoke);text-align:right}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.reacts button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;background:var(--iron);border-radius:999px;font-weight:700;font-size:.95rem}
.reacts button[aria-pressed=true]{background:rgba(255,230,0,.14);color:var(--volt)}
.reacts button.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.thread{margin-top:12px;padding-top:12px;border-top:1px solid var(--steel)}
.thread ul{list-style:none;display:grid;gap:10px;margin-bottom:12px}
.thread li{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;line-height:1.35}
.thread li .av{--s:28px}
.thread li b{font-weight:700;margin-right:6px}
.thread li .muted{font-size:.8rem}
.quick{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.quick button{flex:none;padding:7px 12px;background:var(--iron);border-radius:999px;font-size:.88rem;font-weight:600}
.reply{display:flex;gap:8px}
.reply input{flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid var(--steel);border-radius:12px;background:var(--iron);font-size:16px}
.reply input:focus{outline:none;border-color:var(--volt)}
.event{display:flex;align-items:center;gap:12px;padding:6px 4px}
.event p{flex:1}
.event .muted{font-size:.85rem}
.hof{display:grid;gap:18px;max-width:780px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:16px;text-align:center}
.podium > div{display:flex;flex-direction:column;align-items:center;gap:6px}
.podium .step{width:100%;background:var(--iron);border-radius:10px 10px 0 0;font-family:var(--display);font-weight:700;font-size:1.5rem;padding-top:8px;color:var(--smoke)}
.podium .first .step{height:96px;background:#3A3A2A;color:var(--volt)}
.podium .second .step{height:66px}
.podium .third .step{height:46px}
.podium .av{--s:46px}
.podium .first .av{--s:60px}
.podium b{font-weight:700;font-size:1rem;line-height:1.1}
.podium .val{font-family:var(--display);font-weight:700;font-size:1.2rem}
.records{list-style:none}
.records li{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--steel)}
.records li .holder{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--smoke)}
.records li .holder .av{--s:24px}
.records li b{font-family:var(--display);font-weight:700;font-size:1.3rem;grid-row:span 2}
.link{color:var(--smoke);font-size:.88rem;font-weight:700;padding:6px}
.link:hover{color:var(--volt)}

/* ---------- log ---------- */
.routines{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-bottom:30px}
.routine{position:relative;display:block;text-align:left;padding:18px;background:var(--plate);border:1px solid var(--steel);border-radius:16px;transition:border-color .12s}
.routine:hover{border-color:var(--volt)}
.routine h3{font-size:1.35rem;margin-bottom:6px}
.routine p{font-size:.9rem;color:var(--smoke)}
.routine .storm-tag{display:inline-block;margin-top:10px;padding:3px 10px;background:rgba(0,209,255,.12);color:#6FE3FF;border-radius:999px;font-weight:600;font-size:.8rem}
.routine.empty{background:none;border-style:dashed}
.earn{list-style:none;display:grid;max-width:600px}
.earn li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--steel)}
.earn li b{font-family:var(--display);font-weight:700;font-size:1.2rem;white-space:nowrap}
.log-head{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;margin:0 -18px 20px;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));
  background:rgba(13,13,13,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--steel)}
.log-head .grow{flex:1;min-width:0}
.wname{width:100%;background:none;border:0;font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1;padding:2px 0}
.wname:focus{outline:none;border-bottom:2px solid var(--volt)}
.live{text-align:right;line-height:1}
.live b{display:block;font-family:var(--display);font-weight:700;font-size:2.2rem;color:var(--volt)}
.live span{font-size:.8rem;color:var(--smoke);font-weight:600}
.ex{margin-bottom:12px;padding:16px;background:var(--plate);border:1px solid var(--steel);border-radius:16px;max-width:740px}
.ex header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:6px}
.ex header h3{flex:1 1 auto;font-size:1.25rem}
.ex header .tools{display:flex;gap:2px;margin-left:auto}
.beat{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:.82rem;font-weight:700;color:var(--volt)}
.beat svg{width:15px;height:15px}
.set-row{display:grid;grid-template-columns:28px minmax(0,1fr) 78px 66px 48px;align-items:center;gap:8px;padding:5px 0}
.set-row.head{font-size:.78rem;color:var(--smoke);font-weight:600;padding-bottom:2px}
.set-row .sn{font-weight:700;font-size:1rem;color:var(--smoke);text-align:center}
.set-row .prev{font-size:.85rem;color:var(--smoke);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row input{width:100%;height:46px;border:1px solid var(--steel);border-radius:10px;background:var(--iron);text-align:center;font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.set-row input::-webkit-inner-spin-button{display:none}
.set-row input:focus{outline:none;border-color:var(--volt)}
.check{position:relative;display:grid;place-items:center;width:48px;height:46px;border:2px solid var(--steel);border-radius:10px;color:var(--smoke)}
.check svg{width:22px;height:22px}
.set-row.done .check{background:var(--volt);border-color:var(--volt);color:var(--iron)}
.set-row.done input{border-color:transparent;background:rgba(255,230,0,.1)}
.float{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-weight:700;font-size:1rem;color:var(--volt);pointer-events:none;animation:float .9s ease-out forwards;white-space:nowrap}
@keyframes float{to{transform:translate(-50%,-32px);opacity:0}}
.add-set{margin-top:6px;padding:8px 0;font-size:.92rem;font-weight:700;color:var(--smoke)}
.add-set:hover{color:var(--chalk)}
.log-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px;max-width:740px}
.log-actions .btn.primary{flex:1;min-width:200px}
#view-log.active{padding-bottom:80px}
.rest{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:25;transform:translateX(-50%);
  display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--volt);color:var(--iron);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap}
.rest.on{display:flex}
.rest b{font-family:var(--display);font-weight:700;font-size:1.7rem;min-width:54px;line-height:1}
.rest button{min-height:40px;padding:0 12px;border-radius:10px;font-weight:700;font-size:.95rem}
.rest button.solid{background:var(--iron);color:var(--volt)}
.rest .ring{width:30px;height:30px;transform:rotate(-90deg)}
.mini{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:24;display:none;align-items:center;gap:12px;
  padding:10px 10px 10px 16px;background:var(--plate);border:1px solid #4A4A2A;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);text-decoration:none}
.mini.on{display:flex}
.mini .grow{flex:1;min-width:0;line-height:1.15}
.mini b{display:block;font-weight:700;font-size:1rem}
.mini span{font-size:.85rem;color:var(--smoke)}
@media (max-width:959px){body.has-mini .rest{bottom:calc(var(--nav-h) + 94px + env(safe-area-inset-bottom))}}
@media (min-width:960px){
  .log-head{margin:0 -52px 24px;padding:18px 52px}
  .rest{bottom:28px;left:calc(50% + 120px)}
  .mini{left:auto;right:28px;bottom:28px;width:350px}
}

/* ---------- sheet, toast, story, confetti ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;padding:12px 22px calc(28px + env(safe-area-inset-bottom));
  background:var(--iron);border-top:1px solid var(--steel);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:44px;height:5px;background:var(--steel);border-radius:99px;margin:0 auto 18px}
.sheet h2{font-size:1.7rem}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:580px;max-height:86vh;border:1px solid var(--steel);border-radius:20px;padding:28px 30px 30px;
    transform:translate(-50%,-46%);opacity:0;transition:transform .22s ease,opacity .22s ease,visibility 0s .22s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;transition:transform .22s ease,opacity .22s ease}
  .sheet .grab{display:none}
}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:80;display:flex;align-items:center;gap:10px;transform:translate(-50%,-160%);visibility:hidden;max-width:min(92vw,480px);
  padding:12px 18px;background:var(--plate);color:var(--chalk);border:1px solid var(--steel);border-radius:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.alert{border-color:var(--red)}
.toast .av{--s:30px;box-shadow:0 0 0 2px var(--iron)}
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

.story{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:var(--bg,#0D0D0D);color:var(--fg,#F2F2EE);transition:background .35s ease;overflow:hidden}
.story.on{display:flex}
.story .bars{display:flex;gap:5px;padding:calc(12px + env(safe-area-inset-top)) 14px 0}
.story .bars i{flex:1;height:4px;background:currentColor;opacity:.3;overflow:hidden;position:relative}
.story .bars i.done{opacity:1}
.story .bars i.cur{opacity:1;background:transparent;box-shadow:inset 0 0 0 9px rgba(127,127,127,.35)}
.story .bars i.cur b{position:absolute;inset:0;background:var(--fg);transform-origin:left;animation:storybar 5.5s linear forwards}
@keyframes storybar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.story .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.story .top b{font-weight:700;font-size:1rem}
.story .top button{width:44px;height:44px;display:grid;place-items:center}
.story .top svg{width:28px;height:28px}
.story .slide{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:640px;margin:0 auto;padding:20px 28px 40px}
.story .slide > *{animation:sin .45s ease both}
.story .slide > *:nth-child(4){animation-delay:.07s}
.story .slide > *:nth-child(5){animation-delay:.14s}
.story .slide > *:nth-child(6){animation-delay:.21s}
@keyframes sin{from{opacity:0;transform:translateY(12px)}}
.story .kicker{display:inline-block;align-self:flex-start;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;font-size:.9rem}
.story .huge{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(5rem,27vw,11rem);line-height:.8;letter-spacing:-.01em}
.story .mid{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,8vw,3rem);line-height:1;margin-top:14px}
.story .sub{font-size:1.15rem;font-weight:600;margin-top:18px}
.story .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.story .grid div{padding:14px;background:rgba(0,0,0,.14);border-radius:14px;font-weight:600}
.story .grid b{display:block;font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1}
.story .tapzone{position:absolute;top:0;bottom:0;width:38%;z-index:1}
.story .tapzone.l{left:0}
.story .tapzone.r{right:0;width:62%}
.story .cta{position:relative;z-index:2;margin-top:28px;align-self:flex-start}
.story .cta.dark{background:var(--iron);color:var(--volt)}

.picker-search{width:100%;height:52px;padding:0 16px;margin-bottom:14px;border:1px solid var(--steel);border-radius:12px;background:var(--plate);font-size:16px}
.picker-search:focus{outline:none;border-color:var(--volt)}
.picker h4{font-weight:600;font-size:.85rem;color:var(--smoke);margin:18px 0 2px}
.picker button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:10px 4px;border-bottom:1px solid var(--steel);text-align:left;font-weight:600}
.picker button:hover{color:var(--volt)}
.picker button span{color:var(--smoke);font-size:.85rem}
.summary{text-align:center}
.summary .big{font-family:var(--display);font-weight:800;font-size:5.5rem;line-height:.9;color:var(--volt)}
.summary .big-lbl{font-weight:600;font-size:1rem;color:var(--smoke);margin:6px auto 0}
.summary .vs{display:inline-block;margin-top:14px;padding:6px 14px;background:var(--plate);border-radius:999px;font-weight:600;font-size:.9rem}
.summary .vs.up{background:rgba(255,230,0,.14);color:var(--volt)}
.summary .lines{list-style:none;text-align:left;margin:20px 0 24px}
.summary .lines li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--steel);opacity:0;transform:translateX(-10px);animation:line-in .3s ease forwards;font-weight:600}
.summary .lines li b{font-family:var(--display);font-weight:700;font-size:1.2rem}
.summary .row{display:flex;gap:10px}
.summary .row .btn.primary{flex:1}
@keyframes line-in{to{opacity:1;transform:none}}
.profile-sheet .top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.profile-sheet .top .av{--s:66px}
.profile-sheet h2{margin:0}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:6px 0 18px;border-radius:12px;overflow:hidden}
.stat-row div{padding:12px 4px;background:var(--plate);text-align:center}
.stat-row b{display:block;font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.1}
.stat-row span{font-size:.72rem;color:var(--smoke);font-weight:600}
.kv{list-style:none;margin-bottom:20px}
.kv li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--steel)}
.kv li > span:first-child{color:var(--smoke)}
.kv li > span:last-child{text-align:right;font-weight:600}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:4px 0 18px;padding:14px;background:var(--plate);border-radius:14px;text-align:center}
.h2h b{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1}
.h2h span{display:block;font-size:.78rem;color:var(--smoke);font-weight:600}
.inbox{list-style:none}
.inbox li button{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--steel);text-align:left;line-height:1.35;font-weight:500}
.inbox li.unread button{font-weight:700}
.inbox li.unread button p::before{content:"";display:inline-block;width:9px;height:9px;margin-right:8px;background:var(--red);border-radius:50%;vertical-align:middle}
.inbox .muted{font-size:.8rem;display:block;margin-top:2px;font-weight:500}
.plates-svg{width:100%;height:auto;margin:10px 0 6px}
.plate-input{display:flex;align-items:center;gap:8px;margin:8px 0 6px}
.plate-input input{width:130px;height:56px;border:1px solid var(--steel);border-radius:12px;background:var(--plate);text-align:center;font-family:var(--display);font-weight:700;font-size:1.8rem}
.plate-input button{width:56px;height:56px;background:var(--steel);border-radius:12px;font-weight:700;font-size:1.4rem}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--steel);font-weight:600}
.opt-row .muted{font-weight:500}
.switch{position:relative;width:52px;height:30px;background:var(--steel);border-radius:99px;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;background:var(--chalk);border-radius:50%;transition:transform .15s}
.switch[aria-checked=true]{background:var(--volt)}
.switch[aria-checked=true]::after{transform:translateX(22px);background:var(--iron)}
.welcome h2{font-size:2.2rem;margin-bottom:10px}
.welcome .mark{display:block;margin-bottom:16px}
.welcome ol{list-style:none;counter-reset:w;margin:22px 0 26px;display:grid;gap:14px}
.welcome li{counter-increment:w;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.welcome li::before{content:counter(w);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--steel);color:var(--chalk);font-weight:700;font-size:.85rem}

/* ---------- quests & badges ---------- */
.crew-quest{position:relative;padding:22px;background:var(--plate);border:1px solid var(--steel);border-radius:16px;margin-bottom:30px;max-width:840px}
.crew-quest h2{font-size:1.6rem;margin:4px 0 8px}
.stack-bar{display:flex;height:14px;background:var(--iron);border-radius:99px;overflow:hidden;margin:18px 0 12px}
.stack-bar i{height:100%;background:var(--c);border-right:2px solid var(--plate)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--smoke);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;background:var(--c);border-radius:50%}
.quest-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));max-width:840px;margin-bottom:34px}
.quest{padding:18px;background:var(--plate);border:1px solid var(--steel);border-radius:16px}
.quest.done{border-color:#4A4A2A}
.quest h3{font-size:1.2rem;margin-bottom:4px}
.quest p{font-size:.9rem;color:var(--smoke);margin-bottom:14px}
.quest .meta{display:flex;justify-content:space-between;font-size:.9rem;margin-top:8px;font-weight:700}
.quest .meta b{font-family:var(--display);font-size:1.15rem;line-height:1}
.duels{display:grid;gap:12px;max-width:840px;margin-bottom:34px}
.duel{padding:20px;background:var(--plate);border:1px solid var(--steel);border-radius:16px}
.duel h3{font-size:1.25rem;margin-bottom:4px}
.duel-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;margin-top:12px}
.duel-row .bar{height:10px}
.duel-row b{font-family:var(--display);font-weight:700;font-size:1.2rem}
.badge-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 10px 14px;border-radius:16px;transition:background .12s}
.badge:hover{background:var(--plate)}
.badge svg{width:76px;height:76px;margin-bottom:10px}
.badge b{font-weight:700;font-size:.95rem;line-height:1.2}
.badge span{font-size:.82rem;color:var(--smoke);margin-top:5px;font-weight:600}
.badge.locked b{color:var(--smoke)}

/* ---------- me ---------- */
.me-head{position:relative;display:flex;align-items:center;gap:18px;margin-bottom:26px}
.me-head .av{--s:72px;font-size:1.8rem}
.me-head .grow{flex:1;min-width:0}
.me-head h1{font-size:clamp(2.2rem,7vw,3rem)}
.me-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;margin-bottom:34px;max-width:940px;border-radius:16px;overflow:hidden}
.me-stats div{padding:18px;background:var(--plate)}
.me-stats b{display:block;font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1}
.me-stats span{color:var(--smoke);font-size:.9rem;font-weight:600}
@media (min-width:700px){.me-stats{grid-template-columns:repeat(4,1fr)}}
.me-grid{display:grid;gap:36px;max-width:940px}
@media (min-width:1000px){.me-grid{grid-template-columns:1fr 1fr}}
.vs-list{list-style:none}
.vs-list li{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--steel);font-weight:600}
.vs-list li b{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1}
.vs-list li .muted{grid-column:1/-1;font-size:.85rem;font-weight:500}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:420px}
.heat i{aspect-ratio:1;background:var(--plate);border-radius:3px}
.heat i.l1{background:rgba(255,230,0,.3)}
.heat i.l2{background:rgba(255,230,0,.55)}
.heat i.l3{background:rgba(255,230,0,.8)}
.heat i.l4{background:var(--volt)}
.heat i.future{background:none;border:1px dashed var(--steel)}
.vol-chart,.line-chart{width:100%;max-width:440px;height:auto}
.vol-chart text,.line-chart text{font-family:var(--body);font-size:11px;font-weight:600;fill:var(--smoke)}
.vol-chart .val,.line-chart .val{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--chalk)}
.pr-list{list-style:none}
.pr-list li button{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;padding:11px 0;border-bottom:1px solid var(--steel);text-align:left;font-weight:600}
.pr-list li button:hover b{color:var(--volt)}
.pr-list li b{font-family:var(--display);font-weight:700;font-size:1.2rem}
.hist{list-style:none}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--steel);font-weight:600}
.hist li b{font-family:var(--display);font-weight:700;font-size:1.2rem}
.ranks{list-style:none;position:relative}
.ranks li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 0;font-weight:600}
.ranks li i{width:16px;height:16px;background:var(--steel);border-radius:50%}
.ranks li.got i{background:var(--volt)}
.ranks li.next i{background:none;border:2px dashed var(--volt)}
.ranks li b{font-weight:700;font-size:1rem}
.ranks li:not(.got) b{color:var(--smoke)}
.ranks li span{color:var(--smoke);font-size:.88rem}
.trophy{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;background:var(--plate);border:1px solid var(--steel);border-radius:14px}
.trophy svg{width:40px;height:40px;flex:none}
.trophy b{display:block;font-weight:700;font-size:1rem;line-height:1.2}
.trophy span span{font-size:.85rem;color:var(--smoke)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .story .bars i.cur b{animation:none;transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main" id="rail"></nav>
  <main>
    <div class="topbar" id="topbar"></div>
    <section class="view" id="view-trail"></section>
    <section class="view" id="view-feed"></section>
    <section class="view" id="view-log"></section>
    <section class="view" id="view-quests"></section>
    <section class="view" id="view-me"></section>
  </main>
</div>
<a class="mini" id="mini" href="#log"></a>
<div class="rest" id="rest" role="status" aria-live="polite">
  <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="5"/><circle id="restArc" cx="18" cy="18" r="15" fill="none" stroke="#0D0D0D" stroke-width="5" stroke-dasharray="94.25" stroke-dashoffset="0"/></svg>
  <b id="restTime" class="num">1:30</b>
  <button data-rest="sub" aria-label="-15 s">−15</button><button data-rest="add" aria-label="+15 s">+15</button><button class="solid" data-rest="skip" id="restSkip">Skip</button>

/* ---------- confetti ---------- */
const cv = $('#confetti'), cx = cv.getContext('2d');
let bits = [], confettiRaf = 0;
function confetti(n = 140) {
  if (REDUCE) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const colors = ['#FFE600', '#FFE600', '#FF3B1F', '#F2F2EE', '#00D1FF', '#FF4FD8'];
  for (let i = 0; i < n; i++) bits.push({
    x: innerWidth * (.2 + Math.random() * .6), y: innerHeight * .35, vx: (Math.random() - .5) * 15, vy: -Math.random() * 16 - 5,
    w: 6 + Math.random() * 7, h: 8 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(colors), life: 0 });
  if (!confettiRaf) confettiRaf = requestAnimationFrame(tickConfetti);
}
function tickConfetti() {
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(b => b.y < innerHeight + 40 && b.life < 260);
  bits.forEach(b => {
    b.life++; b.vy += .38; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c;
    cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.life / 6))); cx.restore();
  });
  confettiRaf = bits.length ? requestAnimationFrame(tickConfetti) : (cx.clearRect(0, 0, innerWidth, innerHeight), 0);
}

const training = { santi: { start: NOW0 - 34 * 60e3, ticks: 0 }, jose: { start: NOW0 - 12 * 60e3, ticks: 0 } };
let tickerTimer;
function liveTick() {
  if (!S.settings.live) return;
  const ids = Object.keys(training);
  if (!ids.length || Math.random() < .15) {
    const idle = CREW.map(c => c.id).filter(id => !training[id]);
    if (idle.length) {
      const id = pick(idle); training[id] = { start: Date.now(), ticks: 0 };
      addLive(id, 'ev_started', { a: ACTS_LABEL[id] });
      pushNote(id, 'n_started', { name: byId(id).name, a: ACTS_LABEL[id] });
      refreshLive(); return;
    }
  }
  const id = pick(ids), tr = training[id];
  const base = CREW.find(c => c.id === id);
  const cur = S.crew[id] || (S.crew[id] = { all: base.all, week: base.week, ws: base.ws });
  const gain = 14 + Math.floor(Math.random() * 34);
  const meS = S.me.all, before = cur.all;
  cur.all += gain; cur.week += gain;
  const act = pick(LIVE_ACTS[id]);
  addLive(id, 'ev_logged', { a: act }, gain);
  showTicker(id, t('ticker_logged', { name: base.name, a: act }), gain);
  if (before < meS && cur.all >= meS) {
    toast(t('t_passed_you', { name: base.name, n: cur.all - meS }), id, true); buzz([30, 40, 30]);
    pushNote(id, 'n_passed', { name: base.name });
  } else if (before < meS && meS - cur.all < 60) pushNote(id, 'n_close', { name: base.name, n: meS - cur.all });
  if (++tr.ticks >= 4 + Math.floor(Math.random() * 3)) {
    delete training[id];
    cur.ws = (cur.ws ?? base.ws) + 1;
    addLive(id, 'ev_finished', { a: ACTS_LABEL[id], n: cur.ws });
    if (cur.ws === WEEK_TARGET) pushNote(id, 'n_goal', { name: base.name });
    else if (cur.ws > WEEK_TARGET) { pushNote(id, 'n_over', { name: base.name, n: cur.ws, x: cur.ws - WEEK_TARGET }); setTimeout(() => showTicker(id, t('ticker_over', { name: base.name, x: cur.ws - WEEK_TARGET }), 50), 4500); }
  }
  save(); refreshLive();
}

function drawMap(order, bountyId) {
  const path = $('#trailPath'), Lh = path.getTotalLength();
  const goal = GOALS[mode];
  const at = f => path.getPointAtLength(Math.max(0, Math.min(1, f)) * Lh);
  const normal = f => {
    const a = at(f - .004), b = at(f + .004);
    const dx = b.x - a.x, dy = b.y - a.y, m = Math.hypot(dx, dy) || 1;
    return { x: -dy / m, y: dx / m };
  };
  let camps = '';
  RANKS.forEach((r, i) => {
    const p = at(i / 6), right = p.x < 330;
    const tx = right ? p.x + 16 : p.x - 16, anchor = right ? 'start' : 'end';
    const label = `${fmt(goal * i / 6)} pts`;
    if (i === 6) {
      camps += `<g><path d="M${p.x} ${p.y + 2}V${p.y - 36}" stroke="#F2F2EE" stroke-width="3"/><path d="M${p.x} ${p.y - 36}h26l-7 8 7 8h-26z" fill="#FF3B1F"/>
        <text class="camp-name" x="${p.x + 34}" y="${p.y - 18}" style="font-size:26px;fill:#FFE600">${L(r)}</text><text class="camp-pts" x="${p.x + 34}" y="${p.y - 2}">${label}</text></g>`;
    } else {
      camps += `<g><rect class="camp-dot" x="${p.x - 6}" y="${p.y - 6}" width="12" height="12" transform="rotate(45 ${p.x} ${p.y})"/>
        <text class="camp-name" x="${tx}" y="${p.y - 1}" text-anchor="${anchor}">${L(r)}</text>
        <text class="camp-pts" x="${tx}" y="${p.y + 14}" text-anchor="${anchor}">${label}</text></g>`;
    }
  });
  $('#camps').innerHTML = camps;
  const targets = order.map(c => ({ c, f: Math.min(1, c[mode] / goal) }));
  const placed = [];
  targets.forEach(tg => {
    const p = at(tg.f), n = normal(tg.f);
    let off = 0, tries = 0;
    const clash = o => placed.some(q => Math.hypot(q.x - (p.x + n.x * o), q.y - (p.y + n.y * o)) < 34);
    while (clash(off) && tries < 6) { tries++; off = (tries % 2 ? 1 : -1) * Math.ceil(tries / 2) * 32; }
    tg.off = off; placed.push({ x: p.x + n.x * off, y: p.y + n.y * off });
  });
  const drawOrder = [...targets].sort((a, b) => (a.c.id === 'you') - (b.c.id === 'you'));
  $('#markers').innerHTML = drawOrder.map(tg => {
    const isMe = tg.c.id === 'you';
    return `<g class="mk ${isMe ? 'me' : ''}" data-climber="${tg.c.id}" tabindex="0" role="button" aria-label="${cname(tg.c)}, ${fmt(tg.c[mode])} pts">
      ${isMe ? '<circle class="halo" r="27"/>' : ''}<circle class="ring" r="${isMe ? 22 : 20}"/>
      <circle class="body" r="17" fill="${tg.c.color}"/><text>${tg.c.initials}</text>
      ${training[tg.c.id] || (isMe && S.workout) ? '<circle class="live" cx="13" cy="-13" r="6"/>' : ''}
      ${tg.c.id === bountyId ? '<text class="bty" x="-22" y="-17">🎯</text>' : ''}
      ${isMe ? `<text class="tag" y="-35">${t('you').toUpperCase()}</text>` : ''}
    </g>`;
  }).join('');
  const els = Object.fromEntries($$('#markers .mk').map(el => [el.dataset.climber, el]));
  const youPath = $('#trailYou');
  youPath.style.strokeDasharray = `${Lh} ${Lh}`;
  const place = (tg, f, k) => {
    const p = at(f), n = normal(f), o = tg.off * k;
    els[tg.c.id].setAttribute('transform', `translate(${(p.x + n.x * o).toFixed(1)} ${(p.y + n.y * o).toFixed(1)})`);
    if (tg.c.id === 'you') youPath.style.strokeDashoffset = Lh * (1 - Math.max(0, Math.min(1, f)));
  };
  const intro = !introDone && !REDUCE;
  targets.forEach(tg => {
    let from = markerFrac[tg.c.id];
    if (from === undefined) from = intro ? 0 : tg.f;
    if (pendingClimb && tg.c.id === 'you') from = Math.min(1, pendingClimb.from / goal);
    if (REDUCE) from = tg.f;
    tg.from = from; place(tg, from, from === tg.f ? 1 : 0);
  });
  const reveal = $('#revealPath');
  reveal.style.strokeDasharray = `${Lh} ${Lh}`;
  let delay = 0;
  if (intro) { reveal.style.strokeDashoffset = Lh; reveal.getBoundingClientRect(); reveal.style.strokeDashoffset = 0; delay = 900; }
  else { reveal.style.transition = 'none'; reveal.style.strokeDashoffset = 0; }
  introDone = true;
  const climbing = pendingClimb; pendingClimb = null;
  const dur = climbing ? 2400 : intro ? 1700 : 800;
  const moving = targets.filter(tg => tg.from !== tg.f);
  targets.forEach(tg => (markerFrac[tg.c.id] = tg.f));
  if (!moving.length) return;
  setTimeout(() => {
    const start = performance.now();
    const frame = now => {
      if (!els[moving[0].c.id].isConnected) return;
      const k = Math.min(1, (now - start) / dur);
      const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      moving.forEach(tg => place(tg, tg.from + (tg.f - tg.from) * e, e));
      if (k < 1) requestAnimationFrame(frame);
      else if (climbing) {
        const msg = climbing.passed.length ? t('climbed_pass', { n: climbing.gained, names: climbing.passed.join(t('and')) }) : t('climbed', { n: climbing.gained });
        toast(climbing.rankUp ? `${t('rank_up', { rank: climbing.rankUp })} ${msg}` : msg);
        if (climbing.passed.length || climbing.rankUp) { confetti(170); buzz([40, 30, 40, 30, 80]); }
      }
    };
    requestAnimationFrame(frame);
  }, climbing ? 450 : delay);
}

// progressive overload: pre-load a little more than last time
function overload(ex) {
  const [a, b] = ex.prev;
  if (ex.type === 'c') return { a: a + 1, b };
  if (ex.bar) return { a: a + 2.5, b };
  return { a, b: b + 1 };
}
function newSet(ex, from) { const src = from || overload(ex); return { a: src.a, b: src.b, done: false }; }
function startWorkout(name, exIds) {
  S.workout = { name, start: Date.now(), items: exIds.map(id => ({ ex: id, sets: (EXMAP[id].type === 'c' ? [0] : [0, 1, 2]).map(() => newSet(EXMAP[id])) })) };
  save(); renderAll();
}
function scoreWorkout(s, w) {
  let sets = 0, vol = 0, prevVol = 0, mins = 0, legs = false, legSets = 0, benchVol = 0;
  const prs = [], groups = new Set();
  w.items.forEach(it => {
    const ex = EXMAP[it.ex];
    let best = null;
    it.sets.forEach(st => {
      if (!st.done) return;
      if (pplOf(ex)) groups.add(pplOf(ex));
      if (ex.type === 'c') { mins += +st.a || 0; sets++; return; }
      const kg = +st.a || 0, reps = +st.b || 0;
      if (!reps) return;
      sets++;
      const load = k => (ex.type === 'bw' ? 80 + k : k);
      vol += load(kg) * reps; prevVol += load(ex.prev[0]) * ex.prev[1];
      if (ex.id === 'bench') benchVol += kg * reps;
      if (ex.group === 'Legs') { legs = true; legSets++; }
      const e = e1rm(ex, kg, reps);
      if (!best || e > best.e) best = { e, kg, reps };
    });
    if (best) {
      const pr = s.prs[ex.id];
      if (!pr || best.e > e1rm(ex, pr.kg, pr.reps) + .01) prs.push({ ex, kg: best.kg, reps: best.reps });
    }
  });
  const lines = [];
  if (sets) lines.push([t('ln_show'), 50]);
  if (sets) lines.push([sets === 1 ? t('ln_set1') : t('ln_sets', { n: sets }), sets * 5]);
  if (legSets) lines.push([t('ln_storm', { w: t('weather_name'), n: legSets }), legSets * 5, true]);
  if (vol >= 100) lines.push([t('ln_vol', { n: vol }), Math.floor(vol / 100)]);
  if (mins) lines.push([t('ln_cardio', { n: mins }), mins * 3]);
  prs.forEach(p => lines.push([t('ln_pr', { x: `${L(p.ex.n)} ${prText(p.ex, p)}` }), 100, true]));
  const vsPct = prevVol ? Math.round((vol / prevVol - 1) * 100) : null;
  return { lines, sets, vol, mins, legs, benchVol, prs, groups, vsPct, total: lines.reduce((a, l) => a + l[1], 0) };
}
const questValue = (s, q) => q.id === 'tonnes' ? s.weekVolumes[7] : q.id === 'ppl' ? s.quests.ppl.length : s.quests[q.id];

function finalize(s0, w) {
  const s = structuredClone(s0);
  const sc = scoreWorkout(s0, w);
  const lines = [...sc.lines];
  const hour = new Date().getHours();
  s.me.ws++; s.me.sessions++; s.me.volumeTotal += sc.vol;
  lines.push(...goalLines(s.me.ws, s.me.streak + 1));
  if (s.me.ws === WEEK_TARGET) s.me.streak++;
  if (sc.vsPct > 0) { s.me.beats++; lines.push([t('ln_better') + ` (+${sc.vsPct}%)`, 25, true]); }
  if (sc.legs) s.me.legDays++;
  if (hour < 7) s.me.dawn++;
  if (hour >= 22) s.me.owl = 1;
  s.weekVolumes[7] = +(s.weekVolumes[7] + sc.vol / 1000).toFixed(1);
  sc.prs.forEach(p => (s.prs[p.ex.id] = { kg: p.kg, reps: p.reps }));
  if (sc.legs) s.quests.legs2++;
  sc.groups.forEach(g => { if (!s.quests.ppl.includes(g)) s.quests.ppl.push(g); });
  s.quests.cardio += sc.mins;
  QUESTS.forEach(q => { if (!s.claimed[q.id] && questValue(s, q) >= q.goal) { s.claimed[q.id] = true; lines.push([t('ln_quest', { q: q.t }), q.bonus, true]); } });
  let pts = lines.reduce((a, l) => a + l[1], 0);
  s.duels.forEach(d => { d.you += d.metric === 'bench' ? sc.benchVol : pts; });
  const crewOthers = crewList().reduce((a, c) => a + c.week, 0);
  if (!s.claimed.crew && crewOthers + s.me.week + pts >= CREW_QUEST.goal) { s.claimed.crew = true; s.me.crewQuests++; lines.push([t('ln_crew'), CREW_QUEST.bonus, true]); pts += CREW_QUEST.bonus; }
  const lead = leaderOther();
  if (!s.claimed.bounty && lead && lead.all > s.me.all && s.me.all + pts > lead.all) { s.claimed.bounty = true; s.me.bounties++; lines.push([t('ln_bounty', { name: lead.name }), BOUNTY_PTS, true]); pts += BOUNTY_PTS; }
  s.me.all += pts; s.me.week += pts;
  BADGES.forEach(b => { if (!s.badges[b.id] && isUnlocked(s, b)) { s.badges[b.id] = true; lines.push([t('ln_badge', { b: b.n }), b.pts, true]); s.me.all += b.pts; s.me.week += b.pts; } });
  const total = lines.reduce((a, l) => a + l[1], 0);
  s.history.unshift({
    id: 'h' + Date.now(), name: w.name || t('wk_default'), at: Date.now(), dur: Math.max(1, Math.round((Date.now() - w.start) / 60000)),
    sets: sc.sets, vol: Math.round(sc.vol), mins: sc.mins, pts: total, vs: sc.vsPct, prs: sc.prs.map(p => `${L(p.ex.n)} ${prText(p.ex, p)}`), react: { fist: 0, fire: 0 },
    items: w.items.filter(it => it.sets.some(x => x.done)).map(it => {
      const ex = EXMAP[it.ex];
      return [ex.id, it.sets.filter(x => x.done).map(x => ex.type === 'c' ? `${x.a} min, ${x.b} km` : ex.type === 'bw' ? `${+x.a ? '+' + x.a : 'BW'}×${x.b}` : `${x.a}×${x.b}`).join(', ')];
    }),
  });
  s.workout = null;
  return { s, lines, total, prs: sc.prs, vsPct: sc.vsPct, unlockedBadges: lines.filter(l => l[0].startsWith(t('ln_badge', { b: '' }).trim())).length };
}

const PLATES = [[25, '#E5242B', 44], [20, '#2463EB', 44], [15, '#FFE600', 40], [10, '#22B35E', 36], [5, '#F2F2EE', 28], [2.5, '#333', 24], [1.25, '#B8BCC6', 20]];
function plateSheet(kg) {
  const draw = total => {
    let side = Math.max(0, (total - 20) / 2);
    const used = [];
    PLATES.forEach(([w, c, h]) => { while (side >= w - 1e-9) { used.push([w, c, h]); side -= w; } });
    const left = +(side * 2).toFixed(2);
    const wd = w => (w >= 10 ? 13 : w >= 5 ? 10 : 8);
    let x = 150, xl = 130, R = '', Lp = '';
    used.forEach(([w, c, h]) => { R += `<rect x="${x}" y="${60 - h}" width="${wd(w)}" height="${h * 2}" rx="2" fill="${c}" stroke="#0D0D0D" stroke-width="1.5"/>`; x += wd(w) + 2; });
    used.forEach(([w, c, h]) => { xl -= wd(w); Lp += `<rect x="${xl}" y="${60 - h}" width="${wd(w)}" height="${h * 2}" rx="2" fill="${c}" stroke="#0D0D0D" stroke-width="1.5"/>`; xl -= 2; });
    const counts = {};
    used.forEach(([w]) => (counts[w] = (counts[w] || 0) + 1));
    const list = Object.entries(counts).sort((a, b) => b[0] - a[0]).map(([w, n]) => `${n} × ${nfmt(+w)} kg`).join(', ');
    return `<svg class="plates-svg" viewBox="0 0 280 120" role="img" aria-label="${t('plate_sub')}">
        <rect x="4" y="56" width="272" height="8" fill="#8E8E8A"/><rect x="128" y="50" width="6" height="20" fill="#B8BCC6"/><rect x="146" y="50" width="6" height="20" fill="#B8BCC6"/>${Lp}${R}</svg>
      <p style="text-align:center;font-weight:700">${used.length ? t('each_side', { x: list }) : total <= 20 ? t('just_bar') : ''}</p>
      ${left > 0 ? `<p class="muted small" style="text-align:center;margin:4px auto 0">${t('cant_load', { n: left })}</p>` : ''}`;
  };
  openSheet(`<h2>${t('plate_title')}</h2><p class="muted">${t('plate_sub')}</p>
    <div class="plate-input"><button data-pl="-2.5" aria-label="-2.5 kg">−</button><input id="plKg" type="number" inputmode="decimal" step="2.5" value="${kg}" aria-label="${t('kg_total')}"><button data-pl="2.5" aria-label="+2.5 kg">+</button><span class="muted">${t('kg_total')}</span></div>
    <div id="plOut">${draw(kg)}</div><button class="btn quiet wide" data-close style="margin-top:10px">${t('done')}</button>`, body => {
    const inp = body.querySelector('#plKg');
    const upd = () => (body.querySelector('#plOut').innerHTML = draw(+inp.value || 0));
    inp.addEventListener('input', upd);
    body.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { inp.value = Math.max(20, (+inp.value || 0) + +b.dataset.pl); upd(); });
  });
}

function progressSheet(id) {
  const ex = EXMAP[id], pr = S.prs[id];

  let val = cur * .84;
  for (let i = 0; i < 11; i++) { val += (cur - val) * (.18 + rnd() * .12) + (rnd() - .5) * cur * .02; pts.push(Math.min(val, cur)); }

  const X = i => p + i * (W - p * 2) / (pts.length - 1), Y = y => 16 + (Hh - 46) * (1 - (y - min) / (max - min));

    return;
  }
  const ft = el.closest('[data-ftab]'); if (ft) { feedTab = ft.dataset.ftab; renderFeed(); return; }
  const th = el.closest('[data-thread]');
  if (th) { const id = th.dataset.thread; openThreads[id] = !openThreads[id]; renderFeed(); if (openThreads[id]) { const inp = $(`[data-reply="${id}"] input`); inp && inp.focus({ preventScroll: true }); } return; }
  const q = el.closest('[data-quick]'); if (q) { addComment(q.dataset.quick, q.textContent); return; }
  const r = el.closest('[data-react]');
  if (r) {
    const id = r.dataset.react, k = r.dataset.k;
    S.reacts[id] = S.reacts[id] || {};
    S.reacts[id][k] = !S.reacts[id][k];
    S.me.reacts += S.reacts[id][k] ? 1 : -1;
    checkSocialBadges(); save(); buzz(10);
    r.setAttribute('aria-pressed', !!S.reacts[id][k]);
    r.classList.remove('pop'); void r.offsetWidth; r.classList.add('pop');
    const base = FEED.find(f => f.id === id);
    r.querySelector('span').textContent = (base ? base.react[k] : 0) + (S.reacts[id][k] ? 1 : 0);
    return;
  }
  if (el.closest('[data-close]')) closeSheet();
});
document.addEventListener('keydown', e => {
  const mk = e.target.closest && e.target.closest('.mk');
  if (mk && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); climberSheet(mk.dataset.climber); }
});

const RENDER = { trail: renderTrail, feed: renderFeed, log: renderLog, quests: renderQuests, me: renderMe };
let currentView = 'trail';
function renderAll() { document.documentElement.lang = lang(); renderRail(); renderTopbar(); renderMini(); RENDER[currentView](); }
function route() {
  const name = (location.hash || '#trail').slice(1);
  currentView = RENDER[name] ? name : 'trail';
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + currentView));
  closeSheet(); closeStory();
  renderAll();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
if (!S.welcomed) setTimeout(welcome, REDUCE ? 0 : 2600);
</script>
